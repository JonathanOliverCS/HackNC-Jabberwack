<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jabberwack — HackNC 2D PvE</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px 14px 36px; background: #101522; color: #e9edf7; font: 16px/1.5 system-ui, sans-serif; text-align: center; }
    h1 { letter-spacing: .08em; margin: 0 0 2px; }
    p { margin: 4px auto 8px; color: #bdcbe0; }
    canvas { display: block; max-width: 100%; height: auto; margin: 18px auto; border: 2px solid #3e536f; image-rendering: pixelated; }
    small { color: #a7b8d1; }
  </style>
</head>
<body>
  <h1>JABBERWACK
  </h1>
  <p>HackNC — 3-level 2D PvE platformer</p>
  <small>A / D move · Space double jump · J attack · H hitboxes · R restart</small>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
